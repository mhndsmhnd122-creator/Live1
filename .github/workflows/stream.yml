name: RAYN Kick Restream

on:
  push:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # تشغيل السكربت لمدة تصل إلى 6 ساعات

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl

      - name: Run Main Script
        run: |
          # تشغيل السكربت في الخلفية لضمان عدم توقفه
          python3 main.py
